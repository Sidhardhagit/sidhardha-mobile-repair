<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Owner Dashboard</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080b10;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
}

.header {
    padding: 20px;
    background: #111820;
    border-bottom: 1px solid #293646;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.header h1 {
    margin: 0;
    font-size: 25px;
}

.header-buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.logout-btn,
.refresh-btn {
    border: none;
    border-radius: 10px;
    padding: 11px 15px;
    color: white;
    font-weight: bold;
    cursor: pointer;
    font-size: 14px;
}

.logout-btn {
    background: #d32f2f;
}

.refresh-btn {
    background: #1976d2;
}

.logout-btn:disabled,
.refresh-btn:disabled {
    opacity: 0.6;
    cursor: wait;
}

.container {
    width: 100%;
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.stat {
    background: #111820;
    border: 1px solid #293646;
    border-radius: 14px;
    padding: 18px;
    text-align: center;
}

.stat-number {
    font-size: 30px;
    font-weight: bold;
}

.stat-title {
    color: #9da8b4;
    margin-top: 5px;
}

.booking {
    background: #111820;
    border: 1px solid #293646;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 18px;
}

.booking-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 15px;
    margin-bottom: 15px;
}

.booking-title {
    font-size: 20px;
    font-weight: bold;
}

.booking-date {
    color: #9da8b4;
    font-size: 13px;
    margin-top: 5px;
}

.booking-id {
    color: #718096;
    font-size: 11px;
    margin-top: 4px;
    word-break: break-all;
}

.status-badge {
    padding: 8px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
    white-space: nowrap;
}

.status-pending {
    background: #493b12;
    color: #ffd666;
}

.status-confirmed {
    background: #123d5c;
    color: #70c7ff;
}

.status-in-repair {
    background: #4a2b08;
    color: #ffb454;
}

.status-completed {
    background: #123d20;
    color: #7ee787;
}

.status-cancelled {
    background: #49171a;
    color: #ff8b88;
}

.details {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.detail {
    background: #0c1117;
    border-radius: 10px;
    padding: 12px;
}

.detail-label {
    color: #8995a3;
    font-size: 12px;
    margin-bottom: 5px;
}

.detail-value {
    font-size: 15px;
    word-break: break-word;
    white-space: pre-wrap;
}

.status-area {
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px solid #293646;
}

.status-area-title {
    font-weight: bold;
    margin-bottom: 10px;
}

.status-controls {
    display: flex;
    align-items: center;
    gap: 10px;
}

.status-select {
    flex: 1;
    max-width: 350px;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #3b4a5c;
    background: #0c1117;
    color: white;
    font-size: 15px;
}

.status-btn {
    padding: 12px 16px;
    border: none;
    border-radius: 10px;
    background: #238636;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.status-btn:disabled {
    opacity: 0.5;
    cursor: wait;
}

.loading,
.empty,
.error {
    text-align: center;
    padding: 35px 15px;
    border-radius: 14px;
    background: #111820;
    border: 1px solid #293646;
}

.error {
    color: #ff8b88;
    line-height: 1.5;
}

.empty {
    color: #9da8b4;
}

.success-message {
    display: none;
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #123d20;
    border: 1px solid #2ea043;
    color: #7ee787;
    padding: 14px 20px;
    border-radius: 12px;
    z-index: 1000;
    max-width: 90%;
    text-align: center;
}

.top-message {
    display: none;
    margin-bottom: 18px;
    padding: 14px;
    border-radius: 12px;
    text-align: center;
    line-height: 1.5;
}

.top-message.error {
    display: block;
    background: #3b1616;
    border: 1px solid #da3633;
    color: #ff8b88;
}

.top-message.success {
    display: block;
    background: #12351d;
    border: 1px solid #238636;
    color: #7ee787;
}

@media (max-width: 700px) {

    .header {
        flex-direction: column;
        align-items: stretch;
    }

    .header h1 {
        text-align: center;
    }

    .header-buttons {
        justify-content: center;
    }

    .refresh-btn,
    .logout-btn {
        flex: 1;
    }

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .details {
        grid-template-columns: 1fr;
    }

    .booking-header {
        flex-direction: column;
    }

    .status-controls {
        flex-direction: column;
        align-items: stretch;
    }

    .status-select {
        max-width: none;
        width: 100%;
    }

    .status-btn {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="header">

    <h1>👑 Owner Dashboard</h1>

    <div class="header-buttons">

        <button
            type="button"
            class="refresh-btn"
            id="refreshBtn"
        >
            🔄 Refresh
        </button>

        <button
            type="button"
            class="logout-btn"
            id="logoutBtn"
        >
            🚪 Logout
        </button>

    </div>

</div>


<div class="container">

    <div
        id="topMessage"
        class="top-message"
    ></div>


    <div class="stats">

        <div class="stat">
            <div
                class="stat-number"
                id="totalCount"
            >
                0
            </div>

            <div class="stat-title">
                Total
            </div>
        </div>


        <div class="stat">
            <div
                class="stat-number"
                id="pendingCount"
            >
                0
            </div>

            <div class="stat-title">
                Pending
            </div>
        </div>


        <div class="stat">
            <div
                class="stat-number"
                id="repairCount"
            >
                0
            </div>

            <div class="stat-title">
                In Repair
            </div>
        </div>


        <div class="stat">
            <div
                class="stat-number"
                id="completedCount"
            >
                0
            </div>

            <div class="stat-title">
                Completed
            </div>
        </div>

    </div>


    <div id="bookings">

        <div class="loading">
            Loading bookings...
        </div>

    </div>

</div>


<div
    class="success-message"
    id="successMessage"
>
    ✅ Status updated successfully!
</div>


<script>

/* =====================================================
   SUPABASE CONFIGURATION
===================================================== */

const SUPABASE_URL =
    "https://gilrmxkflutzbeqlileg.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_cpTh0lXY5b1sVO-JV8hreg_y43eJ7HX";


/* =====================================================
   ELEMENTS
===================================================== */

const bookingsContainer =
    document.getElementById("bookings");

const refreshBtn =
    document.getElementById("refreshBtn");

const logoutBtn =
    document.getElementById("logoutBtn");

const totalCount =
    document.getElementById("totalCount");

const pendingCount =
    document.getElementById("pendingCount");

const repairCount =
    document.getElementById("repairCount");

const completedCount =
    document.getElementById("completedCount");

const successMessage =
    document.getElementById("successMessage");

const topMessage =
    document.getElementById("topMessage");


/* =====================================================
   SESSION
===================================================== */

const accessToken =
    localStorage.getItem(
        "supabase_access_token"
    );

const userRole =
    localStorage.getItem(
        "user_role"
    );


/* =====================================================
   SECURITY CHECK
===================================================== */

if (!accessToken || userRole !== "owner") {

    window.location.href =
        "Login.html";

}


/* =====================================================
   SUPABASE HEADERS
===================================================== */

function getHeaders() {

    return {
        "Content-Type":
            "application/json",

        "apikey":
            SUPABASE_KEY,

        "Authorization":
            "Bearer " + accessToken,

        "Prefer":
            "return=representation"
    };

}


/* =====================================================
   SHOW TOP MESSAGE
===================================================== */

function showTopMessage(
    text,
    type
) {

    topMessage.textContent =
        text;

    topMessage.className =
        "top-message " + type;

}


/* =====================================================
   HIDE TOP MESSAGE
===================================================== */

function hideTopMessage() {

    topMessage.textContent = "";

    topMessage.className =
        "top-message";

}


/* =====================================================
   SHOW SUCCESS
===================================================== */

function showSuccess() {

    successMessage.style.display =
        "block";

    setTimeout(
        function () {

            successMessage.style.display =
                "none";

        },
        2500
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "—";

    }

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =====================================================
   FORMAT STATUS
===================================================== */

function formatStatus(status) {

    if (!status) {

        return "Pending";

    }

    const value =
        String(status)
            .toLowerCase()
            .trim();

    if (value === "pending") {

        return "Pending";

    }

    if (
        value === "confirmed"
    ) {

        return "Confirmed";

    }

    if (
        value === "in_repair" ||
        value === "in repair" ||
        value === "repair"
    ) {

        return "In Repair";

    }

    if (
        value === "completed" ||
        value === "complete"
    ) {

        return "Completed";

    }

    if (
        value === "cancelled" ||
        value === "canceled"
    ) {

        return "Cancelled";

    }

    return status;

}


/* =====================================================
   STATUS CLASS
===================================================== */

function getStatusClass(status) {

    const value =
        String(status || "pending")
            .toLowerCase()
            .trim();

    if (value === "confirmed") {

        return "status-confirmed";

    }

    if (
        value === "in_repair" ||
        value === "in repair" ||
        value === "repair"
    ) {

        return "status-in-repair";

    }

    if (
        value === "completed" ||
        value === "complete"
    ) {

        return "status-completed";

    }

    if (
        value === "cancelled" ||
        value === "canceled"
    ) {

        return "status-cancelled";

    }

    return "status-pending";

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(value) {

    if (!value) {

        return "Date not available";

    }

    try {

        const date =
            new Date(value);

        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return value;

        }

        return date.toLocaleString(
            "en-IN",
            {
                day: "2-digit",
                month: "short",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit"
            }
        );

    } catch (error) {

        return value;

    }

}


/* =====================================================
   FETCH BOOKINGS
===================================================== */

async function fetchBookings() {

    hideTopMessage();

    bookingsContainer.innerHTML =
        `
        <div class="loading">
            Loading bookings...
        </div>
        `;

    try {

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/repair_requests?select=*&order=created_at.desc",
                {
                    method: "GET",
                    headers:
                        getHeaders()
                }
            );


        const text =
            await response.text();


        let data = [];


        try {

            data =
                text
                    ? JSON.parse(text)
                    : [];

        } catch (error) {

            throw new Error(
                "Invalid response from Supabase."
            );

        }


        if (!response.ok) {

            throw new Error(
                data?.message ||
                data?.hint ||
                text ||
                "Unable to load bookings."
            );

        }


        if (!Array.isArray(data)) {

            throw new Error(
                "Supabase returned an unexpected booking response."
            );

        }


        renderBookings(data);

    } catch (error) {

        console.error(
            "BOOKING LOAD ERROR:",
            error
        );

        bookingsContainer.innerHTML =
            `
            <div class="error">

                ❌ Unable to load bookings.

                <br><br>

                ${escapeHtml(
                    error.message
                )}

                <br><br>

                Tap <b>Refresh</b> to try again.

            </div>
            `;

        resetCounters();

    }

}


/* =====================================================
   RESET COUNTERS
===================================================== */

function resetCounters() {

    totalCount.textContent =
        "0";

    pendingCount.textContent =
        "0";

    repairCount.textContent =
        "0";

    completedCount.textContent =
        "0";

}


/* =====================================================
   UPDATE COUNTERS
===================================================== */

function updateCounters(bookings) {

    totalCount.textContent =
        bookings.length;


    let pending = 0;

    let inRepair = 0;

    let completed = 0;


    bookings.forEach(
        function (booking) {

            const status =
                String(
                    booking.status ||
                    "pending"
                )
                .toLowerCase()
                .trim();


            if (
                status === "pending"
            ) {

                pending++;

            }


            if (
                status === "in_repair" ||
                status === "in repair" ||
                status === "repair"
            ) {

                inRepair++;

            }


            if (
                status === "completed" ||
                status === "complete"
            ) {

                completed++;

            }

        }
    );


    pendingCount.textContent =
        pending;

    repairCount.textContent =
        inRepair;

    completedCount.textContent =
        completed;

}


/* =====================================================
   RENDER BOOKINGS
===================================================== */

function renderBookings(bookings) {

    updateCounters(bookings);


    if (bookings.length === 0) {

        bookingsContainer.innerHTML =
            `
            <div class="empty">

                📭 No repair bookings yet.

                <br><br>

                New bookings from the website
                will appear here.

            </div>
            `;

        return;

    }


    bookingsContainer.innerHTML =
        bookings
            .map(
                function (booking) {

                    return createBookingHtml(
                        booking
                    );

                }
            )
            .join("");


    attachBookingEvents();

}


/* =====================================================
   CREATE BOOKING HTML
===================================================== */

function createBookingHtml(
    booking
) {

    const status =
        booking.status ||
        "pending";


    const id =
        booking.id ||
        "";


    return `
    <div class="booking">

        <div class="booking-header">

            <div>

                <div class="booking-title">

                    ${
                        escapeHtml(
                            booking.customer_name ||
                            "Customer"
                        )
                    }

                </div>

                <div class="booking-date">

                    📅 ${
                        escapeHtml(
                            formatDate(
                                booking.created_at
                            )
                        )
                    }

                </div>

                <div class="booking-id">

                    Booking ID:
                    ${escapeHtml(id)}

                </div>

            </div>


            <div
                class="status-badge
                ${getStatusClass(status)}"
            >

                ${escapeHtml(
                    formatStatus(status)
                )}

            </div>

        </div>


        <div class="details">


            <div class="detail">

                <div class="detail-label">
                    📞 Customer Phone
                </div>

                <div class="detail-value">

                    ${
                        escapeHtml(
                            booking.customer_phone
                        )
                    }

                </div>

            </div>


            <div class="detail">

                <div class="detail-label">
                    📱 Mobile Model
                </div>

                <div class="detail-value">

                    ${
                        escapeHtml(
                            booking.mobile_model
                        )
                    }

                </div>

            </div>


            <div class="detail">

                <div class="detail-label">
                    🔧 Repair Service
                </div>

                <div class="detail-value">

                    ${
                        escapeHtml(
                            booking.repair_service
                        )
                    }

                </div>

            </div>


            <div class="detail">

                <div class="detail-label">
                    🏠 Home Pickup
                </div>

                <div class="detail-value">

                    ${
                        escapeHtml(
                            booking.pickup ||
                            "Not specified"
                        )
                    }

                </div>

            </div>


            <div class="detail">

                <div class="detail-label">
                    ?

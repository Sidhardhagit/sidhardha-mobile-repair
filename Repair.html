<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book a Repair</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: #fff;
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
      padding: 25px 18px 50px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #aab2bd;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #344154;
      background: #111821;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #238636;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    .location-row {
      display: flex;
      gap: 10px;
    }

    .location-row input {
      flex: 1;
    }

    .location-btn {
      border: none;
      border-radius: 10px;
      padding: 0 16px;
      background: #1769aa;
      color: white;
      font-weight: bold;
    }

    .pickup-options {
      display: flex;
      gap: 35px;
      margin-top: 10px;
    }

    .pickup-options label {
      margin: 0;
      font-weight: normal;
    }

    .pickup-options input {
      width: auto;
      margin-right: 8px;
    }

    .submit-btn {
      width: 100%;
      margin-top: 28px;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #238636;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .back-btn {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #58a6ff;
      text-decoration: none;
    }

    #message {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }

    .success {
      background: #12351d;
      color: #7ee787;
      border: 1px solid #238636;
    }

    .error {
      background: #3b1616;
      color: #ff7b72;
      border: 1px solid #da3633;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Book a Repair</h1>

    <p class="subtitle">
      Tell us about your device and repair requirement.
    </p>

    <form id="repairForm">

      <label for="customerName">Customer Name</label>
      <input
        type="text"
        id="customerName"
        name="customer_name"
        placeholder="Enter your name"
        required
      >

      <label for="customerPhone">Phone Number</label>
      <input
        type="tel"
        id="customerPhone"
        name="customer_phone"
        placeholder="Enter your phone number"
        required
      >

      <label for="mobileModel">Mobile Model</label>
      <input
        type="text"
        id="mobileModel"
        name="mobile_model"
        placeholder="Example: iPhone 13 / Samsung S23"
        required
      >

      <label for="repairService">Repair Service</label>
      <select id="repairService" name="repair_problem" required>
        <option value="">Select repair service</option>
        <option value="Display Replacement">Display Replacement</option>
        <option value="Battery Replacement">Battery Replacement</option>
        <option value="Charging Problem">Charging Problem</option>
        <option value="Speaker / Mic Problem">Speaker / Mic Problem</option>
        <option value="Camera Problem">Camera Problem</option>
        <option value="Water Damage">Water Damage</option>
        <option value="Software Problem">Software Problem</option>
        <option value="Other Repair">Other Repair</option>
      </select>

      <label for="customerLocation">Customer Location</label>

      <div class="location-row">
        <input
          type="text"
          id="customerLocation"
          name="customer_location"
          placeholder="Enter your address"
          required
        >

        <button
          type="button"
          class="location-btn"
          onclick="getLocation()"
        >
          Use My Location
        </button>
      </div>

      <label>Home Pickup Required?</label>

      <div class="pickup-options">
        <label>
          <input
            type="radio"
            name="pickup"
            value="Yes"
            checked
          >
          Yes
        </label>

        <label>
          <input
            type="radio"
            name="pickup"
            value="No"
          >
          No
        </label>
      </div>

      <label for="additionalMessage">Additional Message</label>

      <textarea
        id="additionalMessage"
        name="additional_message"
        placeholder="Tell us anything else about the repair..."
      ></textarea>

      <button
        type="submit"
        class="submit-btn"
        id="submitBtn"
      >
        Submit Repair Request
      </button>

    </form>

    <div id="message"></div>

    <a href="index.html" class="back-btn">
      ← Back to Website
    </a>

  </div>

  <script>
    /*
      SUPABASE CONNECTION
    */

    const SUPABASE_URL =
      "https://gilrmxkflutzbeqlileg.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_cpTh0lXY5b1sVO-JV8hreg_y43eJ7HX";


    /*
      Automatically select repair service
      when opened like:

      repair.html?service=Display%20Replacement
    */

    const params = new URLSearchParams(window.location.search);
    const selectedService = params.get("service");

    if (selectedService) {
      const serviceSelect =
        document.getElementById("repairService");

      for (const option of serviceSelect.options) {
        if (
          option.value.toLowerCase() ===
          selectedService.toLowerCase()
        ) {
          serviceSelect.value = option.value;
          break;
        }
      }
    }


    /*
      GET CURRENT LOCATION
    */

    function getLocation() {

      const locationInput =
        document.getElementById("customerLocation");

      if (!navigator.geolocation) {
        alert(
          "Location is not supported by your browser. Please enter your address manually."
        );
        return;
      }

      locationInput.value = "Getting your location...";

      navigator.geolocation.getCurrentPosition(

        function(position) {

          const latitude =
            position.coords.latitude;

          const longitude =
            position.coords.longitude;

          locationInput.value =
            "GPS Location: " +
            latitude +
            ", " +
            longitude;
        },

        function() {

          locationInput.value = "";

          alert(
            "Unable to get your location. Please allow location permission or enter your address manually."
          );
        }
      );
    }


    /*
      SUBMIT REPAIR REQUEST TO SUPABASE
    */

    document
      .getElementById("repairForm")
      .addEventListener("submit", async function(event) {

        event.preventDefault();

        const form = event.target;
        const submitBtn =
          document.getElementById("submitBtn");

        const message =
          document.getElementById("message");

        submitBtn.disabled = true;
        submitBtn.textContent = "Submitting...";

        message.style.display = "none";


        const formData = new FormData(form);

        const repairRequest = {
    customer_name:
        formData.get("customer_name"),

    customer_phone:
        formData.get("customer_phone"),

    mobile_model:
        formData.get("mobile_model"),

    repair_service:
        formData.get("repair_service"),

    repair_problem:
        formData.get("repair_problem"),

  

customer_location:
    formData.get("customer_location"),

pickup:
    formData.get("pickup"),
additional_message:
    formData.get("additional_message")
    
};



        try {

          const response = await fetch(
            SUPABASE_URL +
            "/rest/v1/repair_requests",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json",

                "apikey":
                  SUPABASE_KEY,

                "Authorization":
                  "Bearer " + SUPABASE_KEY,

                "Prefer":
                  "return=minimal"
              },

              body:
                JSON.stringify(repairRequest)
            }
          );


          if (!response.ok) {

            const errorText =
              await response.text();

            throw new Error(errorText);
          }


          /*
            SUCCESS
          */

          message.className =
            "success";

          message.textContent =
            "✅ Repair request submitted successfully! We will contact you shortly.";

          message.style.display =
            "block";

          form.reset();


          /*
            Keep default pickup selection
          */

          document.querySelector(
            'input[name="pickup"][value="Yes"]'
          ).checked = true;


        } catch (error) {

    console.error("SUPABASE ERROR:", error);

    message.className = "error";

    message.textContent =
        "❌ " + error.message;

    message.style.display = "block";
        }


        submitBtn.disabled = false;
        submitBtn.textContent =
          "Submit Repair Request";

      });
  </script>

</body>
</html>

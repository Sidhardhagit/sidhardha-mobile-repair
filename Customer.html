<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Book a Repair - Sidhardha Mobile Repairing Service</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: #ffffff;
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
      padding: 25px 18px 50px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #aab2bd;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #344154;
      background: #111821;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #238636;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    .location-row {
      display: flex;
      gap: 10px;
    }

    .location-row input {
      flex: 1;
    }

    .location-btn {
      border: none;
      border-radius: 10px;
      padding: 0 16px;
      background: #1769aa;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .pickup-options {
      display: flex;
      gap: 35px;
      margin-top: 10px;
    }

    .pickup-options label {
      margin: 0;
      font-weight: normal;
    }

    .pickup-options input {
      width: auto;
      margin-right: 8px;
    }

    .submit-btn {
      width: 100%;
      margin-top: 28px;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #238636;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .back-btn {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #58a6ff;
      text-decoration: none;
    }

    #message {
      display: none;
      margin-top: 20px;
      padding: 18px;
      border-radius: 12px;
      text-align: center;
      line-height: 1.6;
    }

    .success {
      background: #12351d;
      color: #7ee787;
      border: 1px solid #238636;
    }

    .error {
      background: #3b1616;
      color: #ff7b72;
      border: 1px solid #da3633;
    }

    .booking-id {
      display: block;
      margin: 10px 0;
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 1px;
      color: #ffffff;
    }

    .sms-note {
      display: block;
      margin-top: 8px;
      color: #aab2bd;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Book a Repair</h1>

    <p class="subtitle">
      Tell us about your device and repair requirement.
    </p>

    <form id="repairForm">

      <!-- CUSTOMER NAME -->
      <label for="customerName">Customer Name</label>

      <input
        type="text"
        id="customerName"
        name="customer_name"
        placeholder="Enter your name"
        required
      >


      <!-- PHONE -->
      <label for="customerPhone">Phone Number</label>

      <input
        type="tel"
        id="customerPhone"
        name="customer_phone"
        placeholder="Enter your phone number"
        inputmode="numeric"
        required
      >


      <!-- MOBILE MODEL -->
      <label for="mobileModel">Mobile Model</label>

      <input
        type="text"
        id="mobileModel"
        name="mobile_model"
        placeholder="Example: iPhone 13 / Samsung S23"
        required
      >


      <!-- REPAIR SERVICE -->
      <label for="repairService">Repair Service</label>

      <select
        id="repairService"
        name="repair_service"
        required
      >
        <option value="">Select repair service</option>

        <option value="Display Replacement">
          Display Replacement
        </option>

        <option value="Battery Replacement">
          Battery Replacement
        </option>

        <option value="Charging Problem">
          Charging Problem
        </option>

        <option value="Speaker / Mic Problem">
          Speaker / Mic Problem
        </option>

        <option value="Camera Problem">
          Camera Problem
        </option>

        <option value="Water Damage">
          Water Damage
        </option>

        <option value="Software Problem">
          Software Problem
        </option>

        <option value="Other Repair">
          Other Repair
        </option>
      </select>


      <!-- REPAIR PROBLEM -->
      <label for="repairProblem">
        Repair Problem
      </label>

      <textarea
        id="repairProblem"
        name="repair_problem"
        placeholder="Tell us what is wrong with the phone..."
        required
      ></textarea>


      <!-- LOCATION -->
      <label for="customerLocation">
        Customer Location
      </label>

      <div class="location-row">

        <input
          type="text"
          id="customerLocation"
          name="customer_location"
          placeholder="Enter your address"
          required
        >

        <button
          type="button"
          class="location-btn"
          onclick="getLocation()"
        >
          Use My Location
        </button>

      </div>


      <!-- PICKUP -->
      <label>
        Home Pickup Required?
      </label>

      <div class="pickup-options">

        <label>
          <input
            type="radio"
            name="pickup"
            value="Yes"
            checked
          >
          Yes
        </label>

        <label>
          <input
            type="radio"
            name="pickup"
            value="No"
          >
          No
        </label>

      </div>


      <!-- ADDITIONAL MESSAGE -->
      <label for="additionalMessage">
        Additional Message
      </label>

      <textarea
        id="additionalMessage"
        name="additional_message"
        placeholder="Tell us anything else about the repair..."
      ></textarea>


      <!-- SUBMIT -->
      <button
        type="submit"
        class="submit-btn"
        id="submitBtn"
      >
        Submit Repair Request
      </button>

    </form>


    <!-- SUCCESS / ERROR MESSAGE -->
    <div id="message"></div>


    <a
      href="index.html"
      class="back-btn"
    >
      ← Back to Website
    </a>

  </div>


  <script>

    /*
      ==========================================
      SUPABASE CONNECTION
      ==========================================
    */

    const SUPABASE_URL =
      "https://gilrmxkflutzbeqlileg.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_cpTh0lXY5b1sVO-JV8hreg_y43eJ7HX";


    /*
      ==========================================
      SMS EDGE FUNCTION
      ==========================================

      We will create this function in Supabase
      in the next step.

      Function name:
      send-booking-sms
    */

    const SMS_FUNCTION_URL =
      SUPABASE_URL +
      "/functions/v1/send-booking-sms";


    /*
      ==========================================
      SERVICE FROM URL
      ==========================================

      Example:

      Customer.html?service=Display%20Replacement
    */

    const params =
      new URLSearchParams(
        window.location.search
      );

    const selectedService =
      params.get("service");

    if (selectedService) {

      const serviceSelect =
        document.getElementById(
          "repairService"
        );

      for (
        const option of serviceSelect.options
      ) {

        if (
          option.value.toLowerCase() ===
          selectedService.toLowerCase()
        ) {

          serviceSelect.value =
            option.value;

          break;
        }
      }
    }


    /*
      ==========================================
      GET CUSTOMER LOCATION
      ==========================================
    */

    function getLocation() {

      const locationInput =
        document.getElementById(
          "customerLocation"
        );

      if (!navigator.geolocation) {

        alert(
          "Location is not supported by your browser. Please enter your address manually."
        );

        return;
      }

      locationInput.value =
        "Getting your location...";

      navigator.geolocation.getCurrentPosition(

        function(position) {

          const latitude =
            position.coords.latitude;

          const longitude =
            position.coords.longitude;

          locationInput.value =
            "GPS Location: " +
            latitude +
            ", " +
            longitude;
        },

        function() {

          locationInput.value = "";

          alert(
            "Unable to get your location. Please allow location permission or enter your address manually."
          );
        }

      );
    }


    /*
      ==========================================
      FORM SUBMISSION
      ==========================================
    */

    document
      .getElementById("repairForm")
      .addEventListener(
        "submit",
        async function(event) {

          event.preventDefault();


          const form =
            event.target;

          const submitBtn =
            document.getElementById(
              "submitBtn"
            );

          const message =
            document.getElementById(
              "message"
            );


          submitBtn.disabled =
            true;

          submitBtn.textContent =
            "Submitting...";

          message.style.display =
            "none";


          /*
            GET FORM DATA
          */

          const formData =
            new FormData(form);


          /*
            BUILD DATABASE RECORD
          */

          const repairRequest = {

            customer_name:
              formData.get(
                "customer_name"
              ),

            customer_phone:
              formData.get(
                "customer_phone"
              ),

            mobile_model:
              formData.get(
                "mobile_model"
              ),

            repair_service:
              formData.get(
                "repair_service"
              ),

            repair_problem:
              formData.get(
                "repair_problem"
              ),

            customer_location:
              formData.get(
                "customer_location"
              ),

            pickup:
              formData.get(
                "pickup"
              ),

            additional_message:
              formData.get(
                "additional_message"
              )
          };


          /*
            BASIC VALIDATION
          */

          if (
            !repairRequest.customer_name
          ) {

            showError(
              "Please enter customer name."
            );

            return;
          }


          if (
            !repairRequest.customer_phone
          ) {

            showError(
              "Please enter phone number."
            );

            return;
          }


          if (
            !repairRequest.mobile_model
          ) {

            showError(
              "Please enter mobile model."
            );

            return;
          }


          if (
            !repairRequest.repair_service
          ) {

            showError(
              "Please select a repair service."
            );

            return;
          }


          if (
            !repairRequest.repair_problem
          ) {

            showError(
              "Please enter the repair problem."
            );

            return;
          }


          if (
            !repairRequest.customer_location
          ) {

            showError(
              "Please enter your location."
            );

            return;
          }


          /*
            ======================================
            INSERT INTO SUPABASE
            ======================================

            IMPORTANT:

            We use:

            Prefer: return=representation

            so Supabase sends the newly-created
            row back to the website.

            This gives us the database ID.
          */

          try {

            const response =
              await fetch(

                SUPABASE_URL +
                "/rest/v1/repair_requests",

                {

                  method: "POST",

                  headers: {

                    "Content-Type":
                      "application/json",

                    "apikey":
                      SUPABASE_KEY,

                    "Authorization":
                      "Bearer " +
                      SUPABASE_KEY,

                    "Prefer":
                      "return=representation"
                  },

                  body:
                    JSON.stringify(
                      repairRequest
                    )
                }
              );


            /*
              CHECK DATABASE RESPONSE
            */

            if (!response.ok) {

              const errorText =
                await response.text();

              throw new Error(
                errorText ||
                "Unable to submit repair request."
              );
            }


            /*
              GET CREATED ROW
            */

            const createdRows =
              await response.json();


            if (
              !Array.isArray(createdRows) ||
              createdRows.length === 0
            ) {

              throw new Error(
                "Booking was created but Booking ID could not be received."
              );
            }


            /*
              GET DATABASE ID
            */

            const bookingDatabaseId =
              createdRows[0].id;


            /*
              CREATE CUSTOMER-FRIENDLY
              BOOKING ID

              Example:

              Database ID: 37

              Booking ID:
              SR-00037
            */

            const bookingId =
              "SR-" +
              String(
                bookingDatabaseId
              ).padStart(5, "0");


            /*
              ======================================
              SHOW SUCCESS MESSAGE
              ======================================
            */

            message.className =
              "success";

            message.innerHTML =

              "✅ Repair booking successful!" +

              "<span class='booking-id'>" +

              "Booking ID: " +

              bookingId +

              "</span>" +

              "<span>" +

              "Please keep this Booking ID for future reference." +

              "</span>" +

              "<span class='sms-note'>" +

              "📱 Confirmation SMS is being sent to your phone." +

              "</span>";

            message.style.display =
              "block";


            /*
              ======================================
              SEND SMS
              ======================================

              IMPORTANT:

              The Edge Function will be created
              in Supabase next.

              If SMS fails, the booking itself
              remains successful.
            */

            try {

              const smsResponse =
                await fetch(
                  SMS_FUNCTION_URL,
                  {

                    method: "POST",

                    headers: {

                      "Content-Type":
                        "application/json",

                      "apikey":
                        SUPABASE_KEY,

                      "Authorization":
                        "Bearer " +
                        SUPABASE_KEY
                    },

                    body:
                      JSON.stringify({

                        booking_id:
                          bookingId,

                        customer_name:
                          repairRequest.customer_name,

                        customer_phone:
                          repairRequest.customer_phone,

                        mobile_model:
                          repairRequest.mobile_model,

                        repair_service:
                          repairRequest.repair_service
                      })
                  }
                );


              if (!smsResponse.ok) {

                console.warn(
                  "SMS sending failed."
                );
              }

            }

            catch (smsError) {

              console.warn(
                "SMS function unavailable:",
                smsError
              );

            }


            /*
              RESET FORM
            */

            form.reset();


            /*
              KEEP HOME PICKUP = YES
            */

            const yesPickup =
              document.querySelector(
                'input[name="pickup"][value="Yes"]'
              );

            if (yesPickup) {

              yesPickup.checked =
                true;
            }


            /*
              KEEP SUCCESS MESSAGE
              VISIBLE AFTER RESET
            */

            message.style.display =
              "block";

          }

          catch (error) {

            console.error(
              "SUPABASE ERROR:",
              error
            );


            message.className =
              "error";

            message.textContent =
              "❌ " +
              (
                error.message ||
                "Something went wrong."
              );

            message.style.display =
              "block";
          }


          /*
            ENABLE BUTTON AGAIN
          */

          submitBtn.disabled =
            false;

          submitBtn.textContent =
            "Submit Repair Request";

        }
      );


    /*
      ==========================================
      SHOW ERROR
      ==========================================
    */

    function showError(text) {

      const message =
        document.getElementById(
          "message"
        );

      const submitBtn =
        document.getElementById(
          "submitBtn"
        );


      message.className =
        "error";

      message.textContent =
        "❌ " + text;

      message.style.display =
        "block";


      submitBtn.disabled =
        false;

      submitBtn.textContent =
        "Submit Repair Request";
    }

  </script>

</body>
</html>
